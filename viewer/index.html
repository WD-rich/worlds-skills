<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>灰烬回路 · Worlds Skills Viewer</title>
    <style>
      :root { color-scheme: dark; --bg:#0b0f16; --panel:#111925; --line:#25354d; --text:#d9e4f1; --muted:#8493a8; --cyan:#54e6e8; --pink:#ff5cad; --amber:#ffc857; --green:#76e39b; }
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 80% -10%,#17304d 0,transparent 42%),var(--bg); color:var(--text); font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
      .shell { max-width:1500px; margin:0 auto; padding:28px; } header { display:flex; justify-content:space-between; align-items:end; gap:18px; margin-bottom:22px; } h1 { margin:0; font-size:clamp(28px,4vw,52px); letter-spacing:-.04em; } .subtitle { color:var(--muted); margin-top:6px; } .badge { border:1px solid #2a566b; color:var(--cyan); padding:7px 11px; border-radius:999px; background:#0c2530; white-space:nowrap; }
      .grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(340px,.65fr); gap:16px; } .panel { background:linear-gradient(145deg,rgba(18,28,43,.96),rgba(12,18,29,.96)); border:1px solid var(--line); border-radius:16px; box-shadow:0 14px 50px rgba(0,0,0,.22); overflow:hidden; } .panel h2 { font-size:14px; letter-spacing:.08em; text-transform:uppercase; color:#9cb1c8; margin:0; padding:16px 18px 12px; border-bottom:1px solid var(--line); } .panel-body { padding:16px 18px; }
      .map-wrap { overflow:auto; background:linear-gradient(180deg,rgba(10,25,40,.28),rgba(10,14,23,.65)); } svg { width:100%; min-width:1050px; height:780px; display:block; } .edge { stroke:#38506b; stroke-width:1.4; opacity:.7; } .node circle { stroke-width:1.5; } .node text { fill:#e5eef8; font-size:10px; text-anchor:middle; pointer-events:none; } .region-label { fill:#7c93ad; font-size:13px; letter-spacing:.08em; } .space-count { fill:#07101a; font-size:9px; font-weight:700; text-anchor:middle; }
      .resources { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; } .resource { padding:11px; border:1px solid var(--line); border-radius:10px; background:#0d1623; } .resource span { display:block; color:var(--muted); font-size:11px; } .resource strong { display:block; margin-top:2px; font-size:20px; color:var(--amber); }
      .actors { max-height:620px; overflow:auto; } .actor { display:grid; grid-template-columns:34px 1fr auto; gap:9px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(37,53,77,.65); } .avatar { width:30px; height:30px; display:grid; place-items:center; border-radius:8px; background:#1f2942; color:var(--pink); font-weight:700; font-size:11px; } .actor-name { font-weight:650; } .actor-meta { color:var(--muted); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .condition { color:var(--green); font-size:11px; }
      .events { max-height:480px; overflow:auto; } .event { position:relative; padding:9px 0 9px 18px; border-bottom:1px solid rgba(37,53,77,.65); } .event::before { content:""; position:absolute; left:0; top:17px; width:7px; height:7px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px var(--cyan); } .event-time { color:var(--cyan); font-size:11px; } .event-type { font-weight:650; margin:2px 0; } .event-detail { color:var(--muted); font-size:12px; } .wide { grid-column:1/-1; } .note { color:var(--muted); font-size:12px; margin:0; }
      @media (max-width:1050px) { .grid { grid-template-columns:1fr; } .resources { grid-template-columns:repeat(4,1fr); } header { align-items:start; flex-direction:column; } } @media (max-width:520px) { .shell { padding:16px; } .resources { grid-template-columns:repeat(2,1fr); } }
    </style>
  </head>
  <body>
    <main class="shell">
      <header><div><h1 id="title">Loading…</h1><div class="subtitle" id="subtitle"></div></div><div class="badge" id="clock">loading</div></header>
      <div class="grid">
        <section class="panel"><h2>60-space graph · 10 regions</h2><div class="map-wrap"><svg id="map" viewBox="0 0 1320 780" aria-label="World space graph"></svg></div></section>
        <aside class="panel"><h2>40 actors · 8 factions</h2><div class="panel-body actors" id="actors"></div></aside>
        <section class="panel wide"><h2>Resource pressure</h2><div class="panel-body"><div class="resources" id="resources"></div></div></section>
        <section class="panel wide"><h2>50-step deterministic timeline</h2><div class="panel-body"><div class="events" id="events"></div><p class="note">事件来自追加日志；查看器只读工作区，不调用外部模型，也不会修改状态。</p></div></section>
      </div>
    </main>
    <script>
      const query = new URLSearchParams(location.search);
      const root = query.get('world') || '../worlds/ashfall-circuit-v0.2-scale';
      const colors = ['#54e6e8','#ff5cad','#ffc857','#76e39b','#a78bfa','#fb7185','#38bdf8','#f59e0b','#22c55e','#e879f9'];
      const get = path => fetch(`${root}/${path}`).then(r => { if (!r.ok) throw Error(path); return r.json(); });
      const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const actorLabel = a => a.callsign || a.name || a.id;
      async function start() {
        const [setting, spaces, state, audit, index, records] = await Promise.all([
          get('content/setting.json'), get('content/spaces.json'), get('runtime/state.json'), get('reports/audit.json'), get('content/actors/index.json'),
          fetch(`${root}/runtime/records.ndjson`).then(r => r.text()).then(t => t.trim().split('\n').map(JSON.parse))
        ]);
        const profiles = await Promise.all(index.actorIds.map(id => get(`content/actors/${id}.json`)));
        const actors = Object.fromEntries(profiles.map(p => [p.id, {...p, ...state.actors[p.id]}]));
        document.querySelector('#title').textContent = setting.title;
        document.querySelector('#subtitle').textContent = `${setting.subtitle} · ${audit.counts.spaces} spaces / ${audit.counts.actors} actors`;
        document.querySelector('#clock').textContent = `DAY ${state.clock.day} · ${state.clock.time} · audit ${audit.status}`;
        drawMap(spaces.spaces, actors); drawActors(actors, spaces.spaces); drawResources(state.resources); drawEvents(records.slice(1));
      }
      function drawMap(spaces, actors) {
        const svg=document.querySelector('#map'), byId=Object.fromEntries(spaces.map(s=>[s.id,s]));
        const positions=Object.fromEntries(spaces.map((s,i)=>[s.id,[100+(i%6)*205,75+Math.floor(i/6)*70]]));
        const edges=[]; const seen=new Set(); spaces.forEach(s=>s.adjacentSpaceIds.forEach(n=>{const key=[s.id,n].sort().join('|');if(!seen.has(key)){seen.add(key);edges.push([s.id,n]);}}));
        const regionIndex={}; spaces.forEach(s=>{regionIndex[s.regionId] ??= Object.keys(regionIndex).length;});
        svg.innerHTML=edges.map(([a,b])=>`<line class="edge" x1="${positions[a][0]}" y1="${positions[a][1]}" x2="${positions[b][0]}" y2="${positions[b][1]}"/>`).join('');
        const counts={}; Object.values(actors).forEach(a=>(counts[a.locationId]=(counts[a.locationId]||0)+1));
        svg.innerHTML+=spaces.map(s=>{const [x,y]=positions[s.id], ri=regionIndex[s.regionId]; return `<g class="node"><title>${esc(s.regionName)} · ${esc(s.name)}\n${esc(s.kind)} · actors ${counts[s.id]||0}</title><circle cx="${x}" cy="${y}" r="23" fill="${colors[ri%colors.length]}" fill-opacity=".24" stroke="${colors[ri%colors.length]}"/><text x="${x}" y="${y+3}">${esc(s.name.slice(0,7))}</text>${counts[s.id]?`<circle cx="${x+18}" cy="${y-18}" r="9" fill="${colors[ri%colors.length]}"/><text class="space-count" x="${x+18}" y="${y-15}">${counts[s.id]}</text>`:''}</g>`;}).join('');
        for(const [rid,ri] of Object.entries(regionIndex)){const first=spaces.find(s=>s.regionId===rid), [x,y]=positions[first.id]; svg.innerHTML+=`<text class="region-label" x="${x-52}" y="${y-38}">${esc(first.regionName)}</text>`;}
      }
      function drawActors(actors, spaces){const names=Object.fromEntries(spaces.map(s=>[s.id,s.name]));document.querySelector('#actors').innerHTML=Object.values(actors).map((a,i)=>`<div class="actor"><div class="avatar">${esc(actorLabel(a).slice(0,2))}</div><div><div class="actor-name">${esc(a.name)} · ${esc(a.callsign)}</div><div class="actor-meta">${esc(a.factionName)} · ${esc(names[a.locationId])} · ${esc(a.activity)}</div></div><div class="condition">${esc(a.condition)}</div></div>`).join('');}
      function drawResources(resources){const labels={'water':'净水','blue-salt':'蓝盐','power':'电力','scrap':'废料','medicine':'药品','memory-integrity':'记忆完整度','signal-heat':'信号热'};document.querySelector('#resources').innerHTML=Object.entries(resources).filter(([k])=>labels[k]).map(([k,v])=>`<div class="resource"><span>${labels[k]} / ${k}</span><strong>${esc(v)}</strong></div>`).join('');}
      function drawEvents(records){document.querySelector('#events').innerHTML=records.map(r=>`<div class="event"><div class="event-time">DAY ${r.gameTime.day} · ${r.gameTime.time} · tick ${r.gameTime.tick} · ${esc(r.phase||'')}</div><div class="event-type">${esc(r.type)}</div><div class="event-detail">${esc(r.data?.chosen || r.data?.stage || r.decisionRuleId || 'world fact')} · ${esc(r.ruleVersion)}</div></div>`).join('');}
      start().catch(error=>{document.querySelector('#title').textContent='Viewer error';document.querySelector('#subtitle').textContent=error.message;});
    </script>
  </body>
</html>
